# Fly.io deployment config for the FastAPI backend.
# Replace `app = "..."` with your own Fly app name (`fly apps create`).
# Then set secrets:
#   fly secrets set TELEGRAM_BOT_TOKEN=... TELEGRAM_BOT_USERNAME=... \
#     REMNAWAVE_URL=... REMNAWAVE_TOKEN=... CORS_ORIGINS=https://your.vercel.app
# Deploy:
#   fly deploy
app = "vpn-shop-api"
primary_region = "fra"

[build]

[env]
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/health"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
